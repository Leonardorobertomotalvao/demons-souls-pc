<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <!-- Arte conceitual original: a crônica — pergaminho, pena e vela sobre mesa de pedra.
       Desenhada para este site — não é captura do jogo. -->
  <defs>
    <radialGradient id="flame" cx=".5" cy=".6" r=".5">
      <stop offset="0" stop-color="#ffe9bd" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#d99a3f" stop-opacity=".4"/>
      <stop offset="1" stop-color="#d99a3f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d0b6"/>
      <stop offset="1" stop-color="#b3a98c"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2840"/>
      <stop offset="1" stop-color="#0b101d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#05080f"/>

  <!-- arco de fundo -->
  <path d="M140 500 L140 200 Q400 40 660 200 L660 500" fill="none" stroke="#2b3a5c" stroke-width="3" opacity=".8"/>
  <ellipse cx="400" cy="330" rx="330" ry="200" fill="#9fb8e6" opacity=".05"/>

  <!-- mesa -->
  <rect x="60" y="330" width="680" height="34" fill="url(#table)"/>
  <rect x="100" y="364" width="600" height="90" fill="#0d1424"/>
  <line x1="60" y1="330" x2="740" y2="330" stroke="#54617c" stroke-width="1.4" opacity=".7"/>

  <!-- pergaminho -->
  <g>
    <rect x="220" y="252" width="300" height="86" rx="6" fill="url(#parch)"/>
    <rect x="206" y="244" width="18" height="102" rx="9" fill="#c4b995"/>
    <rect x="516" y="244" width="18" height="102" rx="9" fill="#c4b995"/>
    <g stroke="#6d6349" stroke-width="2" opacity=".75">
      <line x1="248" y1="276" x2="492" y2="276"/>
      <line x1="248" y1="292" x2="480" y2="292"/>
      <line x1="248" y1="308" x2="462" y2="308"/>
      <line x1="248" y1="324" x2="470" y2="324"/>
    </g>
  </g>

  <!-- pena -->
  <path d="M560 210 C590 240 610 272 606 306 L596 300 C588 272 574 240 552 216 Z" fill="#d8cfb4"/>
  <path d="M560 210 C574 216 590 240 596 258" fill="none" stroke="#8a7f5e" stroke-width="1.6"/>
  <path d="M604 304 L588 318" stroke="#8a7f5e" stroke-width="3" stroke-linecap="round"/>

  <!-- vela -->
  <g>
    <rect x="620" y="236" width="26" height="66" rx="4" fill="#cfc6a8"/>
    <ellipse cx="633" cy="236" rx="13" ry="5" fill="#e2d9bd"/>
    <path d="M633 214 C627 226 631 232 633 234 C637 230 639 224 633 214 Z" fill="#ffd27a"/>
    <circle cx="633" cy="222" r="26" fill="url(#flame)"/>
    <rect x="606" y="300" width="54" height="10" rx="3" fill="#54617c"/>
  </g>

  <!-- luzes espectrais de fundo -->
  <g fill="#cfe0ff">
    <circle cx="160" cy="150" r="2.6" opacity=".75"/>
    <circle cx="676" cy="128" r="2.2" opacity=".65"/>
    <circle cx="700" cy="200" r="1.8" opacity=".5"/>
    <circle cx="120" cy="240" r="2" opacity=".55"/>
  </g>

  <!-- névoa rasteira -->
  <ellipse cx="400" cy="474" rx="420" ry="34" fill="#9fb8e6" opacity=".09"/>
</svg>
