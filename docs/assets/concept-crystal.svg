<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img">
  <!-- Arte conceitual original: o cristal de renderização — facetas de luz azul sobre pedestal rúnico.
       Desenhada para este site — não é captura do jogo. -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe0ff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#9fb8e6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#9fb8e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8ff"/>
      <stop offset="1" stop-color="#7fa3e6"/>
    </linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc4ff"/>
      <stop offset="1" stop-color="#4e6db3"/>
    </linearGradient>
    <linearGradient id="ped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2840"/>
      <stop offset="1" stop-color="#0b101d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#05080f"/>
  <rect width="800" height="500" fill="url(#glow)" opacity=".6"/>

  <!-- colunas laterais -->
  <g fill="#0d1424">
    <rect x="70" y="90" width="26" height="360"/>
    <rect x="704" y="90" width="26" height="360"/>
  </g>
  <g fill="none" stroke="#2b3a5c" stroke-width="2" opacity=".7">
    <path d="M83 96 L83 60 Q120 34 158 60 L158 96"/>
    <path d="M717 96 L717 60 Q754 34 791 60 L791 96" opacity=".7"/>
  </g>

  <!-- cristal facetado -->
  <g>
    <path d="M400 120 L462 232 L400 330 L338 232 Z" fill="url(#c1)"/>
    <path d="M400 120 L462 232 L400 330 Z" fill="url(#c2)" opacity=".9"/>
    <path d="M400 120 L400 330 L376 300 L362 236 Z" fill="#eef4ff" opacity=".65"/>
    <path d="M400 152 L444 232 L400 306 L356 232 Z" fill="#0d1424" opacity=".3"/>
  </g>
  <ellipse cx="400" cy="240" rx="170" ry="140" fill="url(#glow)"/>

  <!-- runas orbitais -->
  <g stroke="#8fb4ea" stroke-width="2" fill="none" opacity=".85">
    <path d="M530 210 L548 196 L566 210 L548 224 Z"/>
    <path d="M262 214 L278 202 L294 214 L278 226 Z"/>
    <circle cx="292" cy="160" r="7"/>
    <path d="M524 156 L540 156 M532 148 L532 164"/>
  </g>

  <!-- pedestal -->
  <g fill="url(#ped)">
    <rect x="352" y="330" width="96" height="26"/>
    <rect x="366" y="300" width="68" height="32"/>
    <rect x="340" y="356" width="120" height="70"/>
  </g>
  <g stroke="#3a4c74" stroke-width="1.6" opacity=".8">
    <line x1="352" y1="338" x2="448" y2="338"/>
    <line x1="340" y1="368" x2="460" y2="368"/>
  </g>

  <!-- chão + névoa -->
  <rect x="0" y="440" width="800" height="60" fill="#04060b"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#2b3a5c" stroke-width="1" opacity=".6"/>
  <ellipse cx="400" cy="468" rx="380" ry="32" fill="#9fb8e6" opacity=".1"/>
</svg>
